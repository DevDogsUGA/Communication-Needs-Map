[project]
name = "communication-needs-map"
version = "0.1.0"
description = "Communication needs by Mableton council district"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = [
    "db-dtypes>=1.8.0",
    "geopandas>=1.2.0",
    "google-cloud-bigquery>=3.46.2",
    "google-genai>=2.31.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
